<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#1E1B18;
  --surface:#26221E;
  --surface-2:#322C26;
  --line:#3D362F;
  --ink:#F2ECE1;
  --ink-dim:#A89A87;
  --ink-faint:#7A6E60;
  --amber:#E8A33D;
  --amber-dim:#8C6A2E;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
.rf-root{font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); padding:0; border-radius:14px; overflow:hidden; max-width:920px; margin:0 auto;}
.rf-mono{font-family:'JetBrains Mono',monospace;}

/* ---------- HEADER ---------- */
.rf-header{padding:28px 24px 18px; background:radial-gradient(circle at 88% -20%, rgba(232,163,61,0.16), transparent 55%), var(--surface); border-bottom:1px solid var(--line);}
.rf-eyebrow-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.rf-brand-block{display:flex; align-items:center; gap:14px; min-width:0;}
.rf-logo-chip{background:#FFFFFF; border-radius:10px; padding:7px 12px; flex-shrink:0; display:flex; align-items:center; box-shadow:0 1px 0 rgba(0,0,0,0.15);}
.rf-logo-chip img{height:32px; width:auto; display:block;}
@media (max-width:480px){
  .rf-logo-chip{padding:5px 9px;}
  .rf-logo-chip img{height:24px;}
}
.rf-eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.18em; color:var(--amber); text-transform:uppercase; margin:0 0 6px;}
.rf-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:clamp(22px,5vw,30px); letter-spacing:0.01em; text-transform:uppercase; margin:0 0 4px; color:var(--ink);}
.rf-sub{font-size:13px; color:var(--ink-dim); margin:0;}
.rf-edit-header-btn{background:none; border:1px solid var(--line); color:var(--ink-faint); padding:5px 10px; border-radius:6px; font-size:11px; cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap; flex-shrink:0;}
.rf-edit-header-btn:hover{color:var(--amber); border-color:var(--amber);}
.rf-role-active{color:#221803 !important; background:var(--amber) !important; border-color:var(--amber) !important; font-weight:600;}
.rf-count-line{font-size:11.5px; color:var(--ink-faint); margin-top:4px; font-family:'JetBrains Mono',monospace;}

.rf-tabs{display:flex; gap:6px; margin-top:18px; overflow-x:auto; padding-bottom:2px;}
.rf-tabs::-webkit-scrollbar{height:4px;}
.rf-tabs::-webkit-scrollbar-thumb{background:var(--line); border-radius:2px;}
.rf-tab{flex-shrink:0; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-dim); padding:8px 14px; border-radius:8px 8px 0 0; font-size:12.5px; font-weight:500; font-family:'Inter',sans-serif; cursor:pointer; white-space:nowrap;}
.rf-tab.rf-tab-active{background:var(--bg); color:var(--amber); border-color:var(--line); border-bottom:1px solid var(--bg); font-weight:600;}
.rf-tab-add{flex-shrink:0; background:none; border:1px dashed var(--ink-faint); color:var(--ink-faint); padding:8px 12px; border-radius:8px 8px 0 0; font-size:12.5px; cursor:pointer;}
.rf-tab-add:hover{color:var(--amber); border-color:var(--amber);}
.rf-tab-sep{flex-shrink:0; width:1px; background:var(--line); margin:6px 2px;}

.rf-stats-row{display:flex; gap:14px; margin-top:18px; flex-wrap:wrap;}
.rf-stat-card{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px 16px; flex:1; min-width:118px;}
.rf-stat-num{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--ink); line-height:1.1;}
.rf-stat-label{font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.08em; margin-top:3px;}
.rf-stat-num.rf-amber{color:var(--amber);}
.rf-cost-breakdown{font-size:11px; color:var(--ink-faint); margin-top:10px; font-family:'JetBrains Mono',monospace;}
.rf-cost-breakdown b{color:var(--ink-dim); font-weight:600;}

.rf-legend{margin-top:18px; display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:8px;}
.rf-legend-item{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-dim);}
.rf-legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.rf-legend-bar{flex:1; height:5px; background:var(--line); border-radius:3px; overflow:hidden;}
.rf-legend-fill{height:100%; border-radius:3px; transition:width .4s ease;}
.rf-legend-count{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-faint); min-width:30px; text-align:right;}

.rf-project-meta{display:flex; align-items:center; justify-content:space-between; margin-top:16px; gap:10px;}
.rf-project-name{font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; color:var(--ink); text-transform:uppercase; letter-spacing:0.02em;}
.rf-icon-btn{background:none; border:1px solid var(--line); color:var(--ink-faint); padding:5px 9px; border-radius:6px; font-size:11px; cursor:pointer; font-family:'Inter',sans-serif;}
.rf-icon-btn:hover{color:var(--ink); border-color:var(--ink-faint);}
.rf-icon-btn.rf-danger:hover{color:#E85D4E; border-color:#E85D4E;}
.rf-project-actions{display:flex; gap:6px; flex-wrap:wrap;}

/* collapsible sub-sections (fixed costs / task types) */
.rf-subsection{margin-top:20px; padding:14px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;}

/* fixed costs */
.rf-fixed-row{display:grid; grid-template-columns:1fr 100px 28px; gap:6px; align-items:center; margin-bottom:6px;}
.rf-fixed-row input{background:var(--surface); border:1px solid var(--line); color:var(--ink); padding:7px 9px; border-radius:6px; font-size:12px; font-family:'Inter',sans-serif; width:100%; min-width:0;}
.rf-fixed-row input.rf-num{font-family:'JetBrains Mono',monospace; text-align:right;}
.rf-fixed-row input:focus{outline:none; border-color:var(--amber);}
.rf-fixed-head{display:grid; grid-template-columns:1fr 100px 28px; gap:6px; font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); padding:0 2px 4px;}
.rf-add-fixed{margin-top:6px; background:none; border:1px dashed var(--ink-faint); color:var(--ink-dim); padding:7px; border-radius:7px; font-size:12px; font-family:'Inter',sans-serif; cursor:pointer; width:100%;}
.rf-add-fixed:hover{border-color:var(--amber); color:var(--amber);}
.rf-fixed-total{display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-dim);}
.rf-fixed-total b{color:var(--amber); font-size:14px;}

/* task type manager */
.rf-tasktype-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
.rf-tasktype-chip{display:inline-flex; align-items:center; gap:7px; padding:6px 8px 6px 12px; border-radius:999px; font-size:12px; font-weight:500; color:var(--ink);}
.rf-tasktype-chip button{background:none; border:none; color:inherit; opacity:0.65; cursor:pointer; font-size:13px; padding:0 2px; line-height:1;}
.rf-tasktype-chip button:hover{opacity:1;}
.rf-tasktype-add-row{display:flex; gap:8px;}
.rf-tasktype-add-row input{flex:1; background:var(--surface); border:1px solid var(--line); color:var(--ink); padding:8px 10px; border-radius:7px; font-size:12.5px; font-family:'Inter',sans-serif;}
.rf-tasktype-add-row input:focus{outline:none; border-color:var(--amber);}
.rf-tasktype-add-row button{background:var(--amber); color:#221803; border:none; padding:8px 14px; border-radius:7px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;}

/* stock / magasin */
.rf-stock-row{display:grid; grid-template-columns:1fr 64px 60px 84px 90px 28px; gap:6px; align-items:center; margin-bottom:6px;}
.rf-stock-row input{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); padding:7px 8px; border-radius:6px; font-size:12px; font-family:'Inter',sans-serif; width:100%; min-width:0;}
.rf-stock-row input.rf-num{font-family:'JetBrains Mono',monospace; text-align:right;}
.rf-stock-row input:focus{outline:none; border-color:var(--amber);}
.rf-stock-row.rf-stock-low{box-shadow:inset 3px 0 0 #E85D4E;}
.rf-stock-total{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); text-align:right; white-space:nowrap;}
.rf-stock-head{display:grid; grid-template-columns:1fr 64px 60px 84px 90px 28px; gap:6px; font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); padding:0 2px 4px;}
@media (max-width:600px){
  .rf-stock-row, .rf-stock-head{grid-template-columns:1fr 1fr 1fr;}
  .rf-stock-head{display:none;}
  .rf-stock-row{grid-template-areas:"name name name" "qty unit price" "total total del"; row-gap:5px;}
  .rf-stock-row input:nth-child(1){grid-area:name;}
  .rf-stock-row input:nth-child(2){grid-area:qty;}
  .rf-stock-row input:nth-child(3){grid-area:unit;}
  .rf-stock-row input:nth-child(4){grid-area:price;}
  .rf-stock-row .rf-stock-total{grid-area:total; text-align:left;}
  .rf-stock-row .rf-del-btn{grid-area:del; justify-self:end;}
}

/* project dossier (délais & informations) */
.rf-dossier-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
.rf-dossier-grid input, .rf-dossier-grid textarea{width:100%; background:var(--surface); border:1px solid var(--line); color:var(--ink); padding:8px 10px; border-radius:7px; font-size:12.5px; font-family:'Inter',sans-serif;}
.rf-dossier-grid input:focus, .rf-dossier-grid textarea:focus{outline:none; border-color:var(--amber);}
.rf-dossier-full{grid-column:1 / -1;}
.rf-deadline-badge{display:inline-block; margin-top:2px; padding:3px 9px; border-radius:999px; font-size:11px; font-family:'JetBrains Mono',monospace; font-weight:600;}
.rf-deadline-ok{background:color-mix(in srgb, var(--amber) 20%, var(--surface)); color:var(--amber);}
.rf-deadline-late{background:color-mix(in srgb, #E85D4E 22%, var(--surface)); color:#E85D4E;}
@media (max-width:600px){ .rf-dossier-grid{grid-template-columns:1fr;} }

/* photos */
.rf-photos-wrap{margin-top:8px;}
.rf-photos-grid{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px;}
.rf-photo-thumb{position:relative; width:52px; height:52px; border-radius:6px; overflow:hidden; background:var(--surface-2); border:1px solid var(--line); cursor:zoom-in; flex-shrink:0;}
.rf-photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.rf-photo-del{position:absolute; top:1px; right:1px; background:rgba(0,0,0,0.65); color:#fff; border:none; width:16px; height:16px; border-radius:50%; font-size:11px; line-height:16px; text-align:center; cursor:pointer; padding:0;}
.rf-photo-add-btn{display:inline-flex; align-items:center; gap:6px; background:none; border:1px dashed var(--ink-faint); color:var(--ink-dim); padding:6px 10px; border-radius:7px; font-size:11.5px; cursor:pointer;}
.rf-photo-add-btn:hover{border-color:var(--amber); color:var(--amber);}
.rf-photo-toggle{background:none; border:1px solid var(--line); color:var(--ink-faint); padding:3px 8px; border-radius:6px; font-size:10.5px; cursor:pointer; margin-top:6px; font-family:'Inter',sans-serif;}
.rf-photo-toggle:hover{color:var(--amber); border-color:var(--amber);}
.rf-photo-panel{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
.rf-lightbox{position:fixed; inset:0; background:rgba(10,8,6,0.9); display:flex; align-items:center; justify-content:center; z-index:9999; padding:24px; cursor:zoom-out;}
.rf-lightbox img{max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,0.5);}

/* ---------- OVERVIEW ---------- */
.rf-overview-grid{padding:20px 24px 24px; display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px;}
.rf-ov-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; cursor:pointer; transition:border-color .15s ease;}
.rf-ov-card:hover{border-color:var(--amber);}
.rf-ov-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; text-transform:uppercase; color:var(--ink); margin-bottom:10px;}
.rf-ov-row{display:flex; justify-content:space-between; align-items:baseline; margin-top:6px;}
.rf-ov-label{font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.06em;}
.rf-ov-val{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-dim); font-weight:600;}
.rf-ov-val.rf-amber{color:var(--amber); font-size:15px;}
.rf-ov-bar{height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:10px;}
.rf-ov-bar-fill{height:100%; background:var(--amber); border-radius:3px;}
.rf-ov-breakdown{font-size:10.5px; color:var(--ink-faint); margin-top:6px; font-family:'JetBrains Mono',monospace;}
.rf-ov-add{background:none; border:1px dashed var(--ink-faint); border-radius:12px; padding:16px; display:flex; align-items:center; justify-content:center; color:var(--ink-faint); font-size:13px; cursor:pointer; min-height:100px;}
.rf-ov-add:hover{color:var(--amber); border-color:var(--amber);}
.rf-grand-total{padding-top:16px; display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); margin:0 24px 20px;}
.rf-grand-total-label{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em;}
.rf-grand-total-val{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--amber);}

/* ---------- CONTROLS ---------- */
.rf-controls{padding:16px 24px; display:flex; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--line); background:var(--bg);}
.rf-search{flex:1; min-width:160px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); padding:9px 12px; border-radius:8px; font-size:13px; font-family:'Inter',sans-serif;}
.rf-search:focus{outline:none; border-color:var(--amber);}
.rf-filter-btn{background:var(--surface-2); border:1px solid var(--line); color:var(--ink-dim); padding:9px 14px; border-radius:8px; font-size:12.5px; font-family:'Inter',sans-serif; font-weight:500; cursor:pointer; white-space:nowrap; transition:all .15s ease;}
.rf-filter-btn:hover{color:var(--ink); border-color:var(--ink-faint);}
.rf-filter-btn.rf-active{background:var(--amber); color:#221803; border-color:var(--amber); font-weight:600;}

/* ---------- LIST ---------- */
.rf-list{padding:14px 24px 12px; display:flex; flex-direction:column; gap:10px;}
.rf-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; transition:border-color .15s ease;}
.rf-card.rf-done{border-color:#79B356;}
.rf-card-head{display:flex; align-items:center; gap:14px; padding:12px 14px; cursor:pointer; user-select:none;}
.rf-ring{width:52px;height:52px;border-radius:50%; flex-shrink:0; display:flex;align-items:center;justify-content:center; position:relative;}
.rf-ring-inner{width:38px;height:38px;border-radius:50%; background:var(--surface); display:flex;align-items:center;justify-content:center; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--ink);}
.rf-card-mid{flex:1; min-width:0;}
.rf-card-ref-row{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
.rf-card-ref{font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; letter-spacing:0.02em; color:var(--ink);}
.rf-card-chassis{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint);}
.rf-card-quality{font-size:11px; color:var(--amber); font-family:'JetBrains Mono',monospace;}
.rf-card-situation{font-size:12px; color:var(--ink-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rf-card-cost{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--amber); font-weight:600; white-space:nowrap;}
.rf-chevron{color:var(--ink-faint); font-size:11px; transition:transform .2s ease; flex-shrink:0;}
.rf-card.rf-open .rf-chevron{transform:rotate(180deg);}
.rf-card-body{max-height:0; overflow:hidden; transition:max-height .25s ease; border-top:1px solid transparent;}
.rf-card.rf-open .rf-card-body{border-top:1px solid var(--line);}
.rf-body-inner{padding:16px 16px 18px;}
.rf-section-label{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 10px; display:flex; justify-content:space-between; align-items:center;}

.rf-checks{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-bottom:18px;}
.rf-check{display:flex; flex-direction:column; align-items:flex-start; gap:7px; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); transition:all .15s ease;}
.rf-check-top{display:flex; align-items:center; gap:9px; cursor:pointer;}
.rf-check-top input{appearance:none;-webkit-appearance:none; width:17px;height:17px; border-radius:5px; border:2px solid var(--task-color, var(--ink-faint)); flex-shrink:0; cursor:pointer; position:relative; background:transparent;}
.rf-check-top input:checked{background:var(--task-color, var(--amber)); border-color:var(--task-color, var(--amber));}
.rf-check-top input:checked::after{content:''; position:absolute; left:4px; top:0px; width:5px;height:9px; border:solid #1E1B18; border-width:0 2px 2px 0; transform:rotate(45deg);}
.rf-check-top label{font-size:12.5px; font-weight:500; color:var(--ink-dim); cursor:pointer;}
.rf-check.rf-checked label{color:var(--ink);}
.rf-check.rf-checked{background:color-mix(in srgb, var(--task-color) 14%, var(--surface-2));}
.rf-stars{display:flex; gap:3px;}
.rf-star{cursor:pointer; font-size:15px; line-height:1; color:var(--line); user-select:none;}
.rf-star.rf-star-filled{color:var(--amber);}
.rf-star.rf-static{cursor:default;}

.rf-situation-input{width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); padding:8px 10px; border-radius:7px; font-size:12.5px; font-family:'Inter',sans-serif; margin-bottom:18px; resize:vertical; min-height:34px;}
.rf-situation-input:focus{outline:none; border-color:var(--amber);}

.rf-products{display:flex; flex-direction:column; gap:6px;}
.rf-product-row{display:grid; grid-template-columns:1fr 70px 56px 74px 28px; gap:6px; align-items:center;}
.rf-product-row input{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); padding:7px 8px; border-radius:6px; font-size:12px; font-family:'Inter',sans-serif; width:100%; min-width:0;}
.rf-product-row input.rf-num{font-family:'JetBrains Mono',monospace; text-align:right;}
.rf-product-row input:focus{outline:none; border-color:var(--amber);}
.rf-product-total{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-dim); text-align:right; white-space:nowrap;}
.rf-del-btn{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:15px; padding:2px; line-height:1;}
.rf-del-btn:hover{color:#E85D4E;}
.rf-product-head{display:grid; grid-template-columns:1fr 70px 56px 74px 28px; gap:6px; font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); padding:0 2px 2px;}
.rf-add-product{margin-top:10px; background:none; border:1px dashed var(--ink-faint); color:var(--ink-dim); padding:8px; border-radius:7px; font-size:12px; font-family:'Inter',sans-serif; cursor:pointer; width:100%; transition:all .15s ease;}
.rf-add-product:hover{border-color:var(--amber); color:var(--amber);}

.rf-subtotal-row{display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--line);}
.rf-subtotal-label{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.08em;}
.rf-subtotal-val{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; color:var(--amber);}
.rf-delete-vehicle-row{margin-top:12px; text-align:right;}

.rf-empty{text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13px;}

.rf-add-card{border:1px dashed var(--line); border-radius:12px; padding:14px;}
.rf-add-toggle{background:none; border:none; color:var(--ink-dim); font-size:13px; font-family:'Inter',sans-serif; cursor:pointer; width:100%; text-align:left; display:flex; align-items:center; gap:8px;}
.rf-add-toggle:hover{color:var(--amber);}
.rf-add-form{display:none; margin-top:12px; gap:8px; flex-direction:column;}
.rf-add-form.rf-show{display:flex;}
.rf-add-form input, .rf-add-form textarea{background:var(--surface-2); border:1px solid var(--line); color:var(--ink); padding:9px 10px; border-radius:7px; font-size:13px; font-family:'Inter',sans-serif;}
.rf-add-form input:focus, .rf-add-form textarea:focus{outline:none; border-color:var(--amber);}
.rf-add-submit{background:var(--amber); color:#221803; border:none; padding:9px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;}
.rf-field-label{font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.06em; margin:2px 0 -3px;}

/* team */
.rf-report-item{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px;}
.rf-report-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.rf-report-month{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--amber); font-weight:600;}
.rf-report-text{font-size:12px; color:var(--ink-dim); margin-top:5px; line-height:1.45;}
.rf-report-text b{color:var(--ink-faint); font-weight:600;}
.rf-report-del{margin-top:6px; text-align:right;}
.rf-emp-role{font-size:11.5px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace;}

.rf-footer{padding:14px 24px 20px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
.rf-reset-btn{background:none; border:1px solid var(--line); color:var(--ink-faint); padding:7px 12px; border-radius:7px; font-size:11.5px; font-family:'Inter',sans-serif; cursor:pointer;}
.rf-reset-btn:hover{color:#E85D4E; border-color:#E85D4E;}
.rf-save-note{font-size:11px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace;}

@media (max-width:480px){
  .rf-header{padding:20px 16px 16px;}
  .rf-controls{padding:12px 16px;}
  .rf-list{padding:10px 16px 8px;}
  .rf-overview-grid{padding:16px;}
  .rf-grand-total{margin:0 16px 16px;}
  .rf-product-row{grid-template-columns:1fr 1fr; grid-template-areas:"name name" "price qty" "total del";}
  .rf-product-row input:nth-child(1){grid-column:1/3;}
  .rf-product-head{display:none;}
  .rf-fixed-row{grid-template-columns:1fr 80px 24px;}
}
</style>

  const DEFAULT_TASK_DEFS = [

  const DEFAULT_VEHICLES = [

    {ref:'R2', chassis:'SD35994', situation:'Peinture capot et Porte ARD. Retouche AVD et ARD'},

    {ref:'R4', chassis:'6FPP2CMJ3PSD39333', situation:'En attente'},
    {ref:'R5', chassis:'6FPP2CMJ31SD39329', situation:'En attente'},
    {ref:'R6', chassis:'6FPP2CMJ1PSD36009', situation:'Retouche'},
    {ref:'R7', chassis:'6FPP2CMJ6PSD39326', situation:'En cours'},
    {ref:'R8', chassis:'6FPP2CMJ5PSD39334', situation:'En attente'},
    {ref:'R9', chassis:'6FPP2CMJ4PSD39335', situation:'En attente'},
    {ref:'R10', chassis:'6FPP2CMJPSD39337', situation:'En attente'},
    {ref:'R11', chassis:'SD35997', situation:'Retouche porte ARD et AVD'},
    {ref:'R12', chassis:'SD41163', situation:'Peinture Hardtop et Pare-chocs AV. Retouche Porte ARD'},

    {ref:'R15', chassis:'SD36013', situation:"Non peint car la couleur noire au dessus est visible sous la peinture rouge"},

    {ref:'R20', chassis:'SD38991', situation:'Retouche'},
    {ref:'R21', chassis:'6FPP2CMJXPSD35991Q', situation:'Transférer à Mohammedia'},
  ];

  const FR_MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  function formatMonth(ym){
    if(!ym) return '';
    const parts = ym.split('-');
    const idx = parseInt(parts[1],10) - 1;
    return (FR_MONTHS[idx] || ym) + ' ' + parts[0];
  }
  function currentMonthValue(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function slugify(s){
    return (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'tache';
  }
  function todayISO(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function formatDateFR(iso){
    if(!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    if(isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'long', year:'numeric'});
  }
  function daysUntil(iso){
    if(!iso) return null;
    const target = new Date(iso + 'T00:00:00');
    if(isNaN(target.getTime())) return null;
    const today = new Date();
    today.setHours(0,0,0,0);
    return Math.round((target - today) / 86400000);
  }

  const STORAGE_KEY_V4 = 'ranger-fleet-state-v4';
  const STORAGE_KEY_V3 = 'ranger-fleet-state-v3';
  const STORAGE_KEY_V2 = 'ranger-fleet-state-v2';

  // Code d'accès pour la vue "Direction" (coûts globaux + évaluation de l'équipe).
  // Pour le changer, modifiez simplement la valeur ci-dessous.
  const DIRECTION_PIN = '2026';
  // Rôle courant : 'atelier' (par défaut, avancement + fournitures) ou 'direction' (tout, avec code).
  // Volontairement en mémoire seulement (pas de stockage navigateur) : chaque nouvelle ouverture
  // repart en vue Atelier, et le code doit être ressaisi pour repasser en vue Direction.
  let currentRole = 'atelier';
  let state = null;
  let openCards = new Set();
  let openTaskPhotos = new Set();
  let openEmployeeCards = new Set();
  let currentFilter = 'all';
  let searchTerm = '';
  let addVehicleFormOpen = false;
  let addEmployeeFormOpen = false;
  let addReportOpenFor = null;
  let addReportDrafts = {};

  function todayFR(){ return new Date().toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'}); }

  function makeVehicle(ref, chassis, situation, taskTypes){
    const tasks = {};
    (taskTypes||[]).forEach(t => { tasks[t.key] = {done:false, quality:0, employeeId:null, completedAt:null, photos:[]}; });
    return { ref: ref, chassis: chassis || '', situation: situation || '', tasks, products: [] };
  }

  function freshState(){
    const taskTypes = cloneDefaultTaskTypes();
    return {
      config: {
        eyebrow: 'Atelier · Suivi de flotte',
        title: 'Ranger — Projets en cours',
        dateLine: 'Mise à jour le ' + todayFR()
      },
      activeProjectId: 'p1',
      projects: [
        { id: 'p1', name: 'Marché principal', taskTypes: taskTypes, vehicles: DEFAULT_VEHICLES.map(v => makeVehicle(v.ref, v.chassis, v.situation, taskTypes)), fixedCosts: [], dossier: {startDate:'', deadline:'', info:'', remarks:''} }
      ],
      employees: [],
      stock: [],
      dailyLogs: []
    };
  }

  function makeStockItem(){ return {id:'s'+Date.now()+Math.random().toString(16).slice(2), name:'', quantity:'', unit:'', unitPrice:'', minQty:'', photos:[]}; }
  function ensureDossier(p){ if(!p.dossier) p.dossier = {startDate:'', deadline:'', info:'', remarks:''}; return p.dossier; }
  function normalizePhotoCollections(parsed){
    (parsed.stock||[]).forEach(it => { if(!Array.isArray(it.photos)) it.photos = []; });
    (parsed.dailyLogs||[]).forEach(l => { if(!Array.isArray(l.photos)) l.photos = []; });
    (parsed.employees||[]).forEach(e => { (e.reports||[]).forEach(r => { if(!Array.isArray(r.photos)) r.photos = []; }); });
  }

  function migrateFromV2(old){
    const config = { eyebrow: 'Atelier · Suivi de flotte', title: 'Ranger — Projets en cours', dateLine: 'Mise à jour le ' + todayFR() };
    const projects = old.projects.map(p => {
      const taskTypes = cloneDefaultTaskTypes();
      return {
        id: p.id, name: p.name, taskTypes: taskTypes, fixedCosts: [],
        vehicles: p.vehicles.map(v => {
          const tasks = {};
          taskTypes.forEach(t => { const ov = v.tasks ? v.tasks[t.key] : false; tasks[t.key] = {done: !!ov, quality:0, employeeId:null, completedAt:null, photos:[]}; });
          return {ref:v.ref, chassis:v.chassis, situation:v.situation, tasks, products: v.products || []};
        })
      };
    });
    return {config, activeProjectId: old.activeProjectId || (projects[0]?projects[0].id:'overview'), projects, employees: [], stock: [], dailyLogs: []};
  }

  function migrateFromV3(old){
    const projects = old.projects.map(p => ({
      id: p.id, name: p.name, taskTypes: cloneDefaultTaskTypes(), fixedCosts: p.fixedCosts || [], vehicles: p.vehicles, dossier: {startDate:'', deadline:'', info:'', remarks:''}
    }));
    return {config: old.config, activeProjectId: old.activeProjectId, projects, employees: [], stock: [], dailyLogs: []};
  }

  async function loadState(){
    // 1) Données partagées (visibles par tout le monde qui a le lien) — source de vérité désormais.
    try{
      const res = await window.storage.get(STORAGE_KEY_V4, true);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(parsed && Array.isArray(parsed.projects) && parsed.projects.length){
          if(!parsed.employees) parsed.employees = [];
          if(!parsed.stock) parsed.stock = [];
          if(!parsed.dailyLogs) parsed.dailyLogs = [];
          normalizePhotoCollections(parsed);
          parsed.projects.forEach(p => {
            if(!p.taskTypes) p.taskTypes = cloneDefaultTaskTypes();
            if(!p.fixedCosts) p.fixedCosts = [];
            if(!p.dossier) p.dossier = {startDate:'', deadline:'', info:'', remarks:''};
            p.vehicles = (p.vehicles || []).map(v => {
              v.tasks = v.tasks || {};
              p.taskTypes.forEach(t => {
                if(!v.tasks[t.key]) v.tasks[t.key] = {done:false, quality:0, employeeId:null, completedAt:null};
                if(v.tasks[t.key].employeeId === undefined) v.tasks[t.key].employeeId = null;
                if(v.tasks[t.key].completedAt === undefined) v.tasks[t.key].completedAt = null;
                if(!Array.isArray(v.tasks[t.key].photos)) v.tasks[t.key].photos = [];
              });
              return v;
            });
          });
          return parsed;
        }
      }
    }catch(e){}
    // 2) Migration ponctuelle : reprise de l'ancienne version personnelle (non partagée) si elle existe,
    //    puis on la recopie dans le stockage partagé pour que tout le monde parte des mêmes données.
    try{
      const oldPersonal = await window.storage.get(STORAGE_KEY_V4, false);
      if(oldPersonal && oldPersonal.value){
        const parsedOld = JSON.parse(oldPersonal.value);
        if(parsedOld && Array.isArray(parsedOld.projects) && parsedOld.projects.length){
          if(!parsedOld.employees) parsedOld.employees = [];
          if(!parsedOld.stock) parsedOld.stock = [];
          if(!parsedOld.dailyLogs) parsedOld.dailyLogs = [];
          normalizePhotoCollections(parsedOld);
          parsedOld.projects.forEach(p => {
            if(!p.taskTypes) p.taskTypes = cloneDefaultTaskTypes();
            if(!p.fixedCosts) p.fixedCosts = [];
            if(!p.dossier) p.dossier = {startDate:'', deadline:'', info:'', remarks:''};
            p.vehicles = (p.vehicles || []).map(v => {
              v.tasks = v.tasks || {};
              p.taskTypes.forEach(t => {
                if(!v.tasks[t.key]) v.tasks[t.key] = {done:false, quality:0, employeeId:null, completedAt:null};
                if(v.tasks[t.key].employeeId === undefined) v.tasks[t.key].employeeId = null;
                if(v.tasks[t.key].completedAt === undefined) v.tasks[t.key].completedAt = null;
                if(!Array.isArray(v.tasks[t.key].photos)) v.tasks[t.key].photos = [];
              });
              return v;
            });
          });
          try{ await window.storage.set(STORAGE_KEY_V4, JSON.stringify(parsedOld), true); }catch(e2){}
          return parsedOld;
        }
      }
    }catch(e){}
    try{
      const res3 = await window.storage.get(STORAGE_KEY_V3, false);
      if(res3 && res3.value){
        const parsedV3 = JSON.parse(res3.value);
        if(parsedV3 && Array.isArray(parsedV3.projects) && parsedV3.projects.length) return migrateFromV3(parsedV3);
      }
    }catch(e){}
    try{
      const res2 = await window.storage.get(STORAGE_KEY_V2, false);
      if(res2 && res2.value){
        const parsedV2 = JSON.parse(res2.value);
        if(parsedV2 && Array.isArray(parsedV2.projects) && parsedV2.projects.length) return migrateFromV2(parsedV2);
      }
    }catch(e){}
    return freshState();
  }

  async function saveState(){
    try{
      await window.storage.set(STORAGE_KEY_V4, JSON.stringify(state), true);
      const note = document.getElementById('rfSaveNote');
      note.textContent = 'Enregistré';
      setTimeout(()=>{ note.textContent = 'Sauvegarde automatique activée'; }, 1200);
    }catch(e){
      document.getElementById('rfSaveNote').textContent = 'Erreur de sauvegarde';
    }
  }

  function money(n){ return (Math.round(n*100)/100).toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' DH'; }

  function vehicleProgress(v, taskTypes){
    const done = taskTypes.filter(t => v.tasks[t.key] && v.tasks[t.key].done).length;
    return {done, total: taskTypes.length};
  }
  function vehicleVariableCost(v){ return v.products.reduce((sum,p) => sum + (parseFloat(p.price)||0) * (parseFloat(p.qty)||0), 0); }
  function vehicleAvgQuality(v, taskTypes){
    const rated = taskTypes.map(t => v.tasks[t.key]).filter(t => t && t.done && t.quality > 0);
    if(rated.length === 0) return null;
    return rated.reduce((s,t) => s + t.quality, 0) / rated.length;
  }
  function projectVariableCost(p){ return p.vehicles.reduce((s,v) => s + vehicleVariableCost(v), 0); }
  function projectFixedCost(p){ return (p.fixedCosts||[]).reduce((s,f) => s + (parseFloat(f.amount)||0), 0); }
  function projectTotalCost(p){ return projectVariableCost(p) + projectFixedCost(p); }
  function projectSlots(p){
    const total = p.vehicles.length * p.taskTypes.length;
    const done = p.vehicles.reduce((s,v) => s + vehicleProgress(v, p.taskTypes).done, 0);
    return {done, total};
  }
  function projectAvgQuality(p){
    let sum=0, count=0;
    p.vehicles.forEach(v => { p.taskTypes.forEach(t => { const task=v.tasks[t.key]; if(task && task.done && task.quality>0){ sum+=task.quality; count++; } }); });
    return count===0 ? null : sum/count;
  }
  function stockItemTotal(item){ return (parseFloat(item.quantity)||0) * (parseFloat(item.unitPrice)||0); }
  function stockTotals(){
    const list = state.stock || [];
    const totalValue = list.reduce((s,i) => s + stockItemTotal(i), 0);
    const lowStock = list.filter(i => i.minQty !== '' && i.minQty !== undefined && (parseFloat(i.quantity)||0) <= (parseFloat(i.minQty)||0)).length;
    return {count: list.length, totalValue, lowStock};
  }

  function renderTeamViewIfVisible(){
    if(state.activeProjectId === 'team' && currentRole === 'direction') renderTeamView();
  }

  function employeeTaskStats(empId){
    const rows = [];
    state.projects.forEach(proj => {
      (proj.vehicles || []).forEach(v => {
        proj.taskTypes.forEach(t => {
          const task = v.tasks && v.tasks[t.key];
          if(task && task.done && task.employeeId === empId){
            rows.push({
              project: proj.name,
              vehicle: v.ref,
              task: t.label,
              quality: task.quality || 0,
              completedAt: task.completedAt || null
            });
          }
        });
      });
    });
    return rows;
  }

  function employeeTaskQuality(empId){
    const rows = employeeTaskStats(empId).filter(x => x.quality > 0);
    if(!rows.length) return null;
    return rows.reduce((s,x) => s + x.quality, 0) / rows.length;
  }

  function employeeAvgRating(emp){
    const rated = (emp.reports||[]).filter(r => r.rating > 0);
    if(rated.length===0) return null;
    return rated.reduce((s,r)=>s+r.rating,0) / rated.length;
  }

  function buildRingGradient(v, taskTypes){
    const seg = 360/taskTypes.length;
    const gap = 5;
    const arc = seg - gap;
    let stops = []; let angle = 0;
    taskTypes.forEach(t => {
      const on = v.tasks[t.key] && v.tasks[t.key].done;
      const col = on ? t.color : 'rgba(255,255,255,0.08)';
      stops.push(`${col} ${angle}deg ${angle+arc}deg`);
      stops.push(`transparent ${angle+arc}deg ${angle+seg}deg`);
      angle += seg;
    });
    return `conic-gradient(${stops.join(',')})`;
  }

  function getActiveProject(){ return state.projects.find(p => p.id === state.activeProjectId); }

  /* ---------------- PHOTOS ---------------- */

  let photoCache = {};

  function compressImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1000;
          let w = img.width, h = img.height;
          if(w > maxDim || h > maxDim){
            if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
            else { w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = () => reject(new Error('image load failed'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('file read failed'));
      reader.readAsDataURL(file);
    });
  }

  async function getPhotoDataUrl(id){
    if(photoCache[id]) return photoCache[id];
    try{
      const res = await window.storage.get('photo-' + id, true);
      if(res && res.value){ photoCache[id] = res.value; return res.value; }
    }catch(e){}
    return null;
  }

  function openLightbox(url){
    const overlay = document.createElement('div');
    overlay.className = 'rf-lightbox';
    const img = document.createElement('img');
    img.src = url;
    overlay.appendChild(img);
    overlay.addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  // photosArray: array of {id, addedAt} stored on the parent object (mutated in place).
  // onChange(): called after add/remove — should saveState() and re-render the current view.
  function renderPhotoUploader(photosArray, onChange){
    const wrap = document.createElement('div');
    wrap.className = 'rf-photos-wrap';

    if(photosArray.length > 0){
      const grid = document.createElement('div');
      grid.className = 'rf-photos-grid';
      photosArray.forEach((ph, idx) => {
        const thumb = document.createElement('div');
        thumb.className = 'rf-photo-thumb';
        const img = document.createElement('img');
        thumb.appendChild(img);
        getPhotoDataUrl(ph.id).then(url => { if(url) img.src = url; });
        thumb.addEventListener('click', async () => {
          const url = await getPhotoDataUrl(ph.id);
          if(url) openLightbox(url);
        });
        const del = document.createElement('button');
        del.className = 'rf-photo-del';
        del.textContent = '×';
        del.title = 'Supprimer cette photo';
        del.addEventListener('click', async (e) => {
          e.stopPropagation();
          photosArray.splice(idx, 1);
          try{ await window.storage.delete('photo-' + ph.id, true); }catch(err){}
          onChange();
        });
        thumb.appendChild(del);
        grid.appendChild(thumb);
      });
      wrap.appendChild(grid);
    }

    const addBtn = document.createElement('label');
    addBtn.className = 'rf-photo-add-btn';
    addBtn.textContent = '📷 Ajouter une photo';
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.style.display = 'none';
    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      addBtn.textContent = 'Ajout en cours...';
      try{
        const dataUrl = await compressImage(file);
        const id = 'p' + Date.now() + Math.random().toString(16).slice(2);
        await window.storage.set('photo-' + id, dataUrl, true);
        photoCache[id] = dataUrl;
        photosArray.push({id, addedAt: new Date().toISOString()});
        onChange();
      }catch(err){
        alert("La photo n'a pas pu être ajoutée.");
        addBtn.textContent = '📷 Ajouter une photo';
      }
    });
    addBtn.appendChild(input);
    wrap.appendChild(addBtn);

    return wrap;
  }

  function switchTo(id){
    state.activeProjectId = id;
    openCards = new Set();
    searchTerm = '';
    currentFilter = 'all';
    addVehicleFormOpen = false;
    saveState();
    renderAll();
  }

    document.getElementById('rfEyebrow').textContent = state.config.eyebrow;
    document.getElementById('rfTitle').textContent = state.config.title;
    document.getElementById('rfDateLine').textContent = state.config.dateLine;
  }

  function updateRoleBtn(){
    const btn = document.getElementById('rfRoleBtn');
    const resetBtn = document.getElementById('rfResetBtn');
    if(currentRole === 'direction'){
      btn.textContent = '🔓 Vue Direction';
      btn.classList.add('rf-role-active');
      resetBtn.style.display = '';
    } else {
      btn.textContent = '👷 Vue Atelier';
      btn.classList.remove('rf-role-active');
      resetBtn.style.display = 'none';
    }
  }

  document.getElementById('rfRoleBtn').addEventListener('click', () => {
    if(currentRole === 'direction'){
      currentRole = 'atelier';
      renderAll();
      return;
    }
    const code = prompt('Code Direction :');
    if(code === null) return;
    if(code.trim() === DIRECTION_PIN){
      currentRole = 'direction';
      renderAll();
    } else {
      alert('Code incorrect.');
    }
  });

  document.getElementById('rfEditHeaderBtn').addEventListener('click', () => {
    const t = prompt('Titre principal :', state.config.title);
    if(t === null) return;
    const e = prompt('Sous-titre (petit texte au-dessus du titre) :', state.config.eyebrow);
    if(e === null) return;
    const d = prompt('Ligne de date / mise à jour :', state.config.dateLine);
    if(d === null) return;
    state.config.title = t.trim() || state.config.title;
    state.config.eyebrow = e.trim() || state.config.eyebrow;
    state.config.dateLine = d.trim() || state.config.dateLine;
    saveState();
    renderHeaderStatic();
  });

  function renderTabs(){
    const tabs = document.getElementById('rfTabs');
    tabs.innerHTML = '';

    if(currentRole === 'direction'){
      const ovBtn = document.createElement('button');
      ovBtn.className = 'rf-tab' + (state.activeProjectId === 'overview' ? ' rf-tab-active' : '');
      ovBtn.textContent = "Vue d'ensemble";
      ovBtn.addEventListener('click', () => switchTo('overview'));
      tabs.appendChild(ovBtn);

      const teamBtn = document.createElement('button');
      teamBtn.className = 'rf-tab' + (state.activeProjectId === 'team' ? ' rf-tab-active' : '');
      teamBtn.textContent = 'Équipe';
      teamBtn.addEventListener('click', () => switchTo('team'));
      tabs.appendChild(teamBtn);

      const sep = document.createElement('div');
      sep.className = 'rf-tab-sep';
      tabs.appendChild(sep);
    }

    const stockBtn = document.createElement('button');
    stockBtn.className = 'rf-tab' + (state.activeProjectId === 'stock' ? ' rf-tab-active' : '');
    stockBtn.textContent = 'Magasin';
    stockBtn.addEventListener('click', () => switchTo('stock'));
    tabs.appendChild(stockBtn);

    const dailyBtn = document.createElement('button');

  function renderCountLine(){
    const el = document.getElementById('rfCountLine');

      el.textContent = state.employees.length + ' employé(s) suivi(s)';

      el.textContent = (state.dailyLogs||[]).length + ' bilan(s) journalier(s) enregistré(s)';

      </div>
      <div>
        <span class="rf-field-label">Date d'échéance / délai</span>
        <input type="date" id="rfDossierDeadline" value="${dossier.deadline || ''}">

      <div class="rf-dossier-full">
        <span class="rf-field-label">Informations du marché (référence, client, conditions...)</span>

        <span class="rf-field-label">Remarques</span>

  function renderTaskTypeManager(proj){
    const box = document.createElement('div');
    box.className = 'rf-subsection';
    const label = document.createElement('p');
    label.className = 'rf-section-label';
    label.style.marginBottom = '10px';
    label.innerHTML = `<span>Types de tâches suivies sur ce marché</span>`;
    box.appendChild(label);

    const chipList = document.createElement('div');
    chipList.className = 'rf-tasktype-list';
    proj.taskTypes.forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'rf-tasktype-chip';
      chip.style.background = 'color-mix(in srgb, ' + t.color + ' 22%, var(--surface))';
      chip.style.border = '1px solid ' + t.color;
      chip.innerHTML = `<span>${t.label}</span>`;
      const del = document.createElement('button');
      del.textContent = '×';
      del.title = 'Supprimer cette tâche';
      del.addEventListener('click', () => {
        if(proj.taskTypes.length <= 1){ alert('Il doit rester au moins une tâche suivie.'); return; }
        if(confirm(`Supprimer la tâche "${t.label}" ? Les cases cochées et notes associées seront perdues pour tous les véhicules de ce marché.`)){
          proj.taskTypes = proj.taskTypes.filter(x => x.key !== t.key);
          proj.vehicles.forEach(v => { delete v.tasks[t.key]; });
          saveState();
          renderAll();
        }
      });
      chip.appendChild(del);
      chipList.appendChild(chip);
    });
    box.appendChild(chipList);

    const addRow = document.createElement('div');
    addRow.className = 'rf-tasktype-add-row';
    addRow.innerHTML = `<input type="text" placeholder="Nouvelle tâche (ex: Vitres teintées)"><button>+ Ajouter</button>`;
    const input = addRow.querySelector('input');
    const submit = () => {
      const label = input.value.trim();
      if(!label) return;
      let key = slugify(label);
      let base = key, i = 1;
      while(proj.taskTypes.some(t => t.key === key)){ key = base + '-' + i; i++; }
      const color = COLOR_POOL[proj.taskTypes.length % COLOR_POOL.length];
      proj.taskTypes.push({key, label, color});
      proj.vehicles.forEach(v => { if(!v.tasks[key]) v.tasks[key] = {done:false, quality:0, employeeId:null, completedAt:null, photos:[]}; });
      saveState();
      renderAll();
    };
    addRow.querySelector('button').addEventListener('click', submit);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
    box.appendChild(addRow);

    return box;
  }

  function renderHeaderDynamic(){
    const el = document.getElementById('rfHeaderDynamic');
    el.innerHTML = '';
    renderCountLine();
    if(state.activeProjectId === 'overview' || state.activeProjectId === 'team' || state.activeProjectId === 'stock' || state.activeProjectId === 'dailylog') return;

    const proj = getActiveProject();
    if(!proj) return;
    const {done, total} = projectSlots(proj);
    const pct = total ? Math.round((done/total)*100) : 0;
    const variableCost = projectVariableCost(proj);
    const fixedCost = projectFixedCost(proj);
    const totalCost = variableCost + fixedCost;
    const avgQ = projectAvgQuality(proj);
    const doneVeh = proj.vehicles.filter(v => vehicleProgress(v, proj.taskTypes).done === proj.taskTypes.length).length;
    const noneVeh = proj.vehicles.filter(v => vehicleProgress(v, proj.taskTypes).done === 0).length;
    const progVeh = proj.vehicles.length - doneVeh - noneVeh;

    const metaRow = document.createElement('div');
    metaRow.className = 'rf-project-meta';
    metaRow.innerHTML = `
      <span class="rf-project-name">${proj.name}</span>
      <span class="rf-project-actions">
        ${currentRole === 'direction' ? '<button class="rf-icon-btn" id="rfRenameBtn">Renommer</button><button class="rf-icon-btn rf-danger" id="rfDeleteProjBtn">Supprimer le marché</button>' : ''}
      </span>
    `;
    el.appendChild(metaRow);

    const statsRow = document.createElement('div');
    statsRow.className = 'rf-stats-row';
    statsRow.innerHTML = `
      <div class="rf-stat-card"><div class="rf-stat-num rf-amber">${pct}%</div><div class="rf-stat-label">Avancement</div></div>
      <div class="rf-stat-card"><div class="rf-stat-num">${doneVeh}</div><div class="rf-stat-label">Terminés</div></div>
      <div class="rf-stat-card"><div class="rf-stat-num">${progVeh}</div><div class="rf-stat-label">En cours</div></div>
      <div class="rf-stat-card"><div class="rf-stat-num rf-amber">${avgQ !== null ? avgQ.toFixed(1) + ' ★' : '—'}</div><div class="rf-stat-label">Qualité moyenne</div></div>
      <div class="rf-stat-card">
        <div class="rf-stat-num rf-amber rf-mono">${money(totalCost)}</div>
        <div class="rf-stat-label">Coût total du marché</div>
        <div class="rf-cost-breakdown"><b>${money(variableCost)}</b> variable · <b>${money(fixedCost)}</b> fixe</div>
      </div>
    `;
    el.appendChild(statsRow);

    const legend = document.createElement('div');
    legend.className = 'rf-legend';
    proj.taskTypes.forEach(t => {
      const tv = proj.vehicles.length;
      const dc = proj.vehicles.filter(v => v.tasks[t.key] && v.tasks[t.key].done).length;
      const p2 = tv ? Math.round((dc/tv)*100) : 0;
      const item = document.createElement('div');
      item.className = 'rf-legend-item';
      item.innerHTML = `
        <span class="rf-legend-dot" style="background:${t.color}"></span>
        <span style="min-width:56px;">${t.label}</span>
        <span class="rf-legend-bar"><span class="rf-legend-fill" style="width:${p2}%; background:${t.color};"></span></span>
        <span class="rf-legend-count">${dc}/${tv}</span>
      `;
      legend.appendChild(item);
    });
    el.appendChild(legend);

    el.appendChild(renderProjectDossier(proj));
    el.appendChild(renderTaskTypeManager(proj));
    el.appendChild(renderFixedCosts(proj));

    const renameBtnEl = metaRow.querySelector('#rfRenameBtn');
    if(renameBtnEl) renameBtnEl.addEventListener('click', () => {
      const name = prompt('Nouveau nom pour ce marché :', proj.name);
      if(name && name.trim()){ proj.name = name.trim(); saveState(); renderAll(); }
    });
    const deleteBtnEl = metaRow.querySelector('#rfDeleteProjBtn');
    if(deleteBtnEl) deleteBtnEl.addEventListener('click', () => {
      if(state.projects.length <= 1){ alert("Impossible de supprimer le dernier marché restant."); return; }
      if(confirm(`Supprimer le marché "${proj.name}" et ses ${proj.vehicles.length} véhicule(s) ? Cette action est irréversible.`)){
        state.projects = state.projects.filter(p => p.id !== proj.id);
        switchTo(state.projects[0].id);
      }
    });
  }

  function matchesFilter(v, taskTypes){
    const {done} = vehicleProgress(v, taskTypes);
    if(currentFilter === 'done') return done === taskTypes.length;
    if(currentFilter === 'progress') return done > 0 && done < taskTypes.length;
    if(currentFilter === 'none') return done === 0;
    return true;
  }
  function matchesSearch(v){
    if(!searchTerm) return true;
    const s = searchTerm.toLowerCase();
    return v.ref.toLowerCase().includes(s) || v.chassis.toLowerCase().includes(s) || (v.situation||'').toLowerCase().includes(s);
  }

  function renderProjectView(){
    const main = document.getElementById('rfMain');
    main.innerHTML = '';
    const proj = getActiveProject();
    if(!proj) return;

    const controls = document.createElement('div');
    controls.className = 'rf-controls';
    controls.innerHTML = `
      <input class="rf-search" id="rfSearch" type="text" placeholder="Rechercher (Ref, châssis, situation)...">
      <button class="rf-filter-btn ${currentFilter==='all'?'rf-active':''}" data-filter="all">Tous</button>
      <button class="rf-filter-btn ${currentFilter==='done'?'rf-active':''}" data-filter="done">Terminés</button>
      <button class="rf-filter-btn ${currentFilter==='progress'?'rf-active':''}" data-filter="progress">En cours</button>
      <button class="rf-filter-btn ${currentFilter==='none'?'rf-active':''}" data-filter="none">Non commencés</button>
    `;
    main.appendChild(controls);
    controls.querySelector('#rfSearch').value = searchTerm;
    controls.querySelector('#rfSearch').addEventListener('input', (e) => { searchTerm = e.target.value; renderProjectView(); });
    controls.querySelectorAll('.rf-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => { currentFilter = btn.dataset.filter; renderProjectView(); });
    });

    const list = document.createElement('div');
    list.className = 'rf-list';
    const filtered = proj.vehicles.filter(v => matchesFilter(v, proj.taskTypes) && matchesSearch(v));

    if(proj.vehicles.length === 0){
      const empty = document.createElement('div');
      empty.className = 'rf-empty';
      empty.textContent = "Aucun véhicule dans ce marché pour l'instant. Ajoute-en un ci-dessous.";
      list.appendChild(empty);
    } else if(filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'rf-empty';
      empty.textContent = 'Aucun véhicule ne correspond à ce filtre.';
      list.appendChild(empty);
    }

    filtered.forEach(v => list.appendChild(renderVehicleCard(v, proj)));
    main.appendChild(list);
    main.appendChild(renderAddVehicleForm(proj));
  }

  function renderVehicleCard(v, proj){
    const {done, total} = vehicleProgress(v, proj.taskTypes);
    const cost = vehicleVariableCost(v);
    const avgQ = vehicleAvgQuality(v, proj.taskTypes);
    const isOpen = openCards.has(v.ref);
    const isDone = done === total;

    const card = document.createElement('div');
    card.className = 'rf-card' + (isDone ? ' rf-done' : '') + (isOpen ? ' rf-open' : '');

    const head = document.createElement('div');
    head.className = 'rf-card-head';
    head.innerHTML = `
      <div class="rf-ring" style="background:${buildRingGradient(v, proj.taskTypes)}">
        <div class="rf-ring-inner">${done}/${total}</div>
      </div>
      <div class="rf-card-mid">
        <div class="rf-card-ref-row">
          <span class="rf-card-ref">${v.ref}</span>
          <span class="rf-card-chassis">${v.chassis}</span>
          ${avgQ !== null ? `<span class="rf-card-quality">${avgQ.toFixed(1)} ★</span>` : ''}
        </div>
        <div class="rf-card-situation">${v.situation || ''}</div>
      </div>
      <div class="rf-card-cost">${cost > 0 ? money(cost) : ''}</div>
      <div class="rf-chevron">&#9660;</div>
    `;
    head.addEventListener('click', () => {
      if(openCards.has(v.ref)) openCards.delete(v.ref); else openCards.add(v.ref);
      renderProjectView();
    });

    const body = document.createElement('div');
    body.className = 'rf-card-body';
    const inner = document.createElement('div');
    inner.className = 'rf-body-inner';

    const checksLabel = document.createElement('p');
    checksLabel.className = 'rf-section-label';
    checksLabel.textContent = 'Tâches (coche, puis note la qualité en étoiles)';
    inner.appendChild(checksLabel);

    const checksGrid = document.createElement('div');
    checksGrid.className = 'rf-checks';
    proj.taskTypes.forEach(t => {
      const task = v.tasks[t.key];
      if(!task) return;
      const wrap = document.createElement('div');
      wrap.className = 'rf-check' + (task.done ? ' rf-checked' : '');
      wrap.style.setProperty('--task-color', t.color);

      const top = document.createElement('label');
      top.className = 'rf-check-top';
      top.innerHTML = `<input type="checkbox" ${task.done ? 'checked' : ''}> <span>${t.label}</span>`;
      top.querySelector('input').addEventListener('change', (e) => {
        task.done = e.target.checked;
        if(!task.done){
          task.quality = 0;
          task.employeeId = null;
          task.completedAt = null;
        } else {
          task.completedAt = new Date().toISOString();
        }
        saveState();
        renderHeaderDynamic();
        renderProjectView();
      });
      wrap.appendChild(top);

      if(task.done){
        const empLabel = document.createElement('span');
        empLabel.className = 'rf-field-label';
        empLabel.textContent = 'Réalisée par';
        empLabel.style.marginTop = '2px';
        wrap.appendChild(empLabel);

        const empSelect = document.createElement('select');
        empSelect.className = 'rf-situation-input';
        empSelect.style.marginBottom = '0';
        empSelect.innerHTML = `<option value="">— Choisir un employé —</option>` +
          state.employees.map(emp => `<option value="${emp.id}">${emp.name}${emp.role ? ' · ' + emp.role : ''}</option>`).join('');
        empSelect.value = task.employeeId || '';
        empSelect.addEventListener('change', (e) => {
          task.employeeId = e.target.value || null;
          if(!task.completedAt) task.completedAt = new Date().toISOString();
          saveState();
          renderTeamViewIfVisible();
        });
        wrap.appendChild(empSelect);

        wrap.appendChild(createStarPicker(task.quality, (val) => {
          task.quality = val;
          saveState();
          renderHeaderDynamic();
          renderProjectView();
        }));
      }

      if(!Array.isArray(task.photos)) task.photos = [];
      const photoKey = v.ref + '::' + t.key;
      const photoBtn = document.createElement('button');
      photoBtn.type = 'button';
      photoBtn.className = 'rf-photo-toggle';
      photoBtn.textContent = '📷 ' + (task.photos.length ? task.photos.length + ' photo(s)' : 'Photos');
      photoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if(openTaskPhotos.has(photoKey)) openTaskPhotos.delete(photoKey); else openTaskPhotos.add(photoKey);
        renderProjectView();
      });
      wrap.appendChild(photoBtn);

      if(openTaskPhotos.has(photoKey)){
        const panel = document.createElement('div');
        panel.className = 'rf-photo-panel';
        panel.appendChild(renderPhotoUploader(task.photos, () => {
          saveState();
          renderProjectView();
        }));
        wrap.appendChild(panel);
      }

      checksGrid.appendChild(wrap);
    });
    inner.appendChild(checksGrid);

    const sitLabel = document.createElement('p');
    sitLabel.className = 'rf-section-label';
    sitLabel.textContent = 'Situation / notes';
    inner.appendChild(sitLabel);

    const sitInput = document.createElement('textarea');
    sitInput.className = 'rf-situation-input';
    sitInput.value = v.situation || '';
    sitInput.rows = 1;
    sitInput.addEventListener('input', (e) => { v.situation = e.target.value; });
    sitInput.addEventListener('blur', () => { saveState(); renderProjectView(); });
    inner.appendChild(sitInput);

  function renderEmployeeCard(emp){
    const isOpen = openEmployeeCards.has(emp.id);
    const avg = employeeAvgRating(emp);

    const card = document.createElement('div');
    card.className = 'rf-card' + (isOpen ? ' rf-open' : '');

    const head = document.createElement('div');
    head.className = 'rf-card-head';
    head.innerHTML = `
      <div class="rf-ring" style="background:${avg !== null ? 'conic-gradient(#E8A33D ' + (avg/5*360) + 'deg, rgba(255,255,255,0.08) 0deg)' : 'rgba(255,255,255,0.08)'}">

      const n = prompt('Nom :', emp.name);
      if(n === null) return;
      const r = prompt('Poste / rôle :', emp.role || '');

      emp.name = n.trim() || emp.name;
      emp.role = r.trim();
      saveState(); renderTeamView();

    metaRow.querySelector('#rfEmpDelBtn').addEventListener('click', () => {
      if(confirm(`Supprimer ${emp.name} et tous ses bilans ?`)){
        state.projects.forEach(proj => (proj.vehicles || []).forEach(v => {
          proj.taskTypes.forEach(t => {
            const task = v.tasks && v.tasks[t.key];
            if(task && task.employeeId === emp.id) task.employeeId = null;
          });
        }));
        state.employees = state.employees.filter(x => x.id !== emp.id);
        saveState(); renderTeamView();
      }
    });

    const taskRows = employeeTaskStats(emp.id);
    const taskQuality = employeeTaskQuality(emp.id);

    const activityLabel = document.createElement('p');

        <div class="rf-stat-num">${taskRows.length}</div>
        <div class="rf-stat-label">Tâches réalisées</div>

        <div class="rf-stat-label">Qualité des tâches</div>
      </div>
    `;

    if(taskRows.length){
      const byMonth = {};
      taskRows.forEach(x => {
        const month = x.completedAt ? x.completedAt.slice(0,7) : currentMonthValue();
        if(!byMonth[month]) byMonth[month] = [];
        byMonth[month].push(x);
      });

      Object.keys(byMonth).sort().reverse().forEach(month => {
        const box = document.createElement('div');
        box.className = 'rf-report-item';
        const top = document.createElement('div');

        const monthSpan = document.createElement('span');

        monthSpan.textContent = formatMonth(month);
        top.appendChild(monthSpan);
        const countSpan = document.createElement('span');
        countSpan.className = 'rf-report-month';
        countSpan.textContent = byMonth[month].length + ' tâche(s)';

        byMonth[month].forEach(x => {

          const line = document.createElement('div');
          line.className = 'rf-report-text';
          line.innerHTML = `<b>${name}</b> · ${count} réalisation(s)`;
          box.appendChild(line);

      inner.appendChild(p);
    }

    const repLabel = document.createElement('p');
    repLabel.className = 'rf-section-label';
    repLabel.textContent = 'Bilans mensuels / observations';
    inner.appendChild(repLabel);

    const sortedReports = [...(emp.reports||[])].sort((a,b) => (b.month||'').localeCompare(a.month||''));
    if(sortedReports.length === 0){
      const p = document.createElement('p');
      p.style.cssText = 'font-size:12px;color:var(--ink-faint);margin:0 0 12px;';
      p.textContent = 'Aucun bilan enregistré.';
      inner.appendChild(p);
    }
    sortedReports.forEach(r => {
      const item = document.createElement('div');
      item.className = 'rf-report-item';
      const top = document.createElement('div');
      top.className = 'rf-report-top';
      const monthSpan = document.createElement('span');
      monthSpan.className = 'rf-report-month';
      monthSpan.textContent = formatMonth(r.month);
      top.appendChild(monthSpan);
      top.appendChild(createStaticStars(r.rating));
      item.appendChild(top);
      if(r.tasksSummary){
        const t1 = document.createElement('div');
        t1.className = 'rf-report-text';
        t1.innerHTML = `<b>Ce qu'il a fait :</b> ${r.tasksSummary}`;
        item.appendChild(t1);
      }
      if(r.valueAdded){
        const t2 = document.createElement('div');
        t2.className = 'rf-report-text';
        t2.innerHTML = `<b>Valeur ajoutée :</b> ${r.valueAdded}`;
        item.appendChild(t2);
      }
      if(!Array.isArray(r.photos)) r.photos = [];
      const photoPanel = document.createElement('div');
      photoPanel.className = 'rf-photo-panel';
      photoPanel.appendChild(renderPhotoUploader(r.photos, () => { saveState(); renderTeamView(); }));
      item.appendChild(photoPanel);
      const delRow = document.createElement('div');
      delRow.className = 'rf-report-del';
      const delBtn = document.createElement('button');
      delBtn.className = 'rf-icon-btn rf-danger';
      delBtn.textContent = 'Supprimer ce bilan';
      delBtn.addEventListener('click', () => {
        emp.reports = emp.reports.filter(x => x !== r);
        saveState(); renderTeamView();
      });
      delRow.appendChild(delBtn);
      item.appendChild(delRow);
      inner.appendChild(item);
    });

    inner.appendChild(renderAddReportForm(emp));

    body.appendChild(inner);
    card.appendChild(head);
    card.appendChild(body);
    if(isOpen){ requestAnimationFrame(() => { body.style.maxHeight = body.scrollHeight + 'px'; }); }
    return card;
  }

    }));

    form.querySelector('#rfRepPhotos').appendChild(renderPhotoUploader(draft.photos, () => renderTeamView()));

    toggle.addEventListener('click', () => {
      addReportOpenFor = (addReportOpenFor === emp.id) ? null : emp.id;
      renderTeamView();
    });

    form.querySelector('#rfRepMonth').addEventListener('input', e => { draft.month = e.target.value; });
    form.querySelector('#rfRepTasks').addEventListener('input', e => { draft.tasksSummary = e.target.value; });
    form.querySelector('#rfRepValue').addEventListener('input', e => { draft.valueAdded = e.target.value; });

    form.querySelector('#rfRepSubmit').addEventListener('click', () => {
      const month = form.querySelector('#rfRepMonth').value || currentMonthValue();

        rating: draft.rating || 0,
        photos: draft.photos || []
      });
      delete addReportDrafts[emp.id];
      addReportOpenFor = null;
      saveState();
      renderTeamView();

    return box;

  /* ---------------- STOCK / MAGASIN VIEW ---------------- */

  let stockSearchTerm = '';
  let openStockPhotos = new Set();

  function renderStockView(){
    const main = document.getElementById('rfMain');
    main.innerHTML = '';
    if(!state.stock) state.stock = [];

    const totals = stockTotals();
    const statsWrap = document.createElement('div');
    statsWrap.style.padding = '0 24px 16px';
    statsWrap.innerHTML = `
      <div class="rf-stats-row">
        <div class="rf-stat-card"><div class="rf-stat-num">${totals.count}</div><div class="rf-stat-label">Références en stock</div></div>
        <div class="rf-stat-card"><div class="rf-stat-num rf-amber rf-mono">${money(totals.totalValue)}</div><div class="rf-stat-label">Valeur totale du stock</div></div>
        <div class="rf-stat-card"><div class="rf-stat-num" style="${totals.lowStock ? 'color:#E85D4E' : ''}">${totals.lowStock}</div><div class="rf-stat-label">Sous le seuil minimum</div></div>
      </div>
    `;
    main.appendChild(statsWrap);

    const controls = document.createElement('div');
    controls.className = 'rf-controls';
    controls.innerHTML = `<input class="rf-search" id="rfStockSearch" type="text" placeholder="Rechercher un produit du magasin...">`;
    main.appendChild(controls);
    controls.querySelector('#rfStockSearch').value = stockSearchTerm;
    controls.querySelector('#rfStockSearch').addEventListener('input', e => { stockSearchTerm = e.target.value; renderStockView(); });

    const box = document.createElement('div');
    box.style.padding = '16px 24px 8px';

    const filtered = state.stock.filter(it => !stockSearchTerm || (it.name||'').toLowerCase().includes(stockSearchTerm.toLowerCase()));

    if(state.stock.length === 0){
      const empty = document.createElement('div');
      empty.className = 'rf-empty';
      empty.textContent = "Aucun produit en stock pour l'instant. Ajoute ton inventaire ci-dessous.";
      box.appendChild(empty);
    } else if(filtered.length === 0){
      const empty = document.createElement('div');
      empty.className = 'rf-empty';
      empty.textContent = 'Aucun produit ne correspond à cette recherche.';
      box.appendChild(empty);
    } else {
      const head = document.createElement('div');
      head.className = 'rf-stock-head';
      head.innerHTML = `<span>Produit</span><span>Qté</span><span>Unité</span><span>Prix U.</span><span>Valeur</span><span></span>`;
      box.appendChild(head);

      filtered.forEach(item => {
        const isLow = item.minQty !== '' && item.minQty !== undefined && (parseFloat(item.quantity)||0) <= (parseFloat(item.minQty)||0);
        const row = document.createElement('div');
        row.className = 'rf-stock-row' + (isLow ? ' rf-stock-low' : '');
        row.innerHTML = `
          <input type="text" placeholder="Nom du produit (ex: Peinture rouge 1L)" value="${item.name || ''}">
          <input type="number" class="rf-num" placeholder="0" step="0.01" value="${item.quantity !== undefined && item.quantity !== '' ? item.quantity : ''}">
          <input type="text" placeholder="L, kg, pièce..." value="${item.unit || ''}">
          <input type="number" class="rf-num" placeholder="0" step="0.01" value="${item.unitPrice !== undefined && item.unitPrice !== '' ? item.unitPrice : ''}">
          <span class="rf-stock-total">${money(stockItemTotal(item))}</span>
          <button class="rf-del-btn" title="Supprimer">&times;</button>
        `;
        const [nameInp, qtyInp, unitInp, priceInp] = row.querySelectorAll('input');
        nameInp.addEventListener('input', e => { item.name = e.target.value; });
        nameInp.addEventListener('blur', () => saveState());
        qtyInp.addEventListener('input', e => { item.quantity = e.target.value; row.querySelector('.rf-stock-total').textContent = money(stockItemTotal(item)); });
        qtyInp.addEventListener('blur', () => { saveState(); renderCountLine(); });
        unitInp.addEventListener('input', e => { item.unit = e.target.value; });
        unitInp.addEventListener('blur', () => saveState());
        priceInp.addEventListener('input', e => { item.unitPrice = e.target.value; row.querySelector('.rf-stock-total').textContent = money(stockItemTotal(item)); });
        priceInp.addEventListener('blur', () => { saveState(); renderStockView(); });
        row.querySelector('.rf-del-btn').addEventListener('click', () => {
          state.stock = state.stock.filter(x => x !== item);
          saveState(); renderStockView();
        });
        box.appendChild(row);

        if(!Array.isArray(item.photos)) item.photos = [];
        const photoBtn = document.createElement('button');
        photoBtn.type = 'button';
        photoBtn.className = 'rf-photo-toggle';
        photoBtn.style.marginBottom = '10px';
        photoBtn.textContent = '📷 ' + (item.photos.length ? item.photos.length + ' photo(s)' : 'Photos');
        photoBtn.addEventListener('click', () => {
          if(openStockPhotos.has(item.id)) openStockPhotos.delete(item.id); else openStockPhotos.add(item.id);
          renderStockView();
        });
        box.appendChild(photoBtn);
        if(openStockPhotos.has(item.id)){
          const panel = document.createElement('div');
          panel.className = 'rf-photo-panel';
          panel.style.marginBottom = '10px';
          panel.appendChild(renderPhotoUploader(item.photos, () => { saveState(); renderStockView(); }));
          box.appendChild(panel);
        }
      });
    }

    const addBtn = document.createElement('button');
    addBtn.className = 'rf-add-fixed';
    addBtn.style.marginTop = '10px';
    addBtn.textContent = '+ Ajouter un produit au magasin';
    addBtn.addEventListener('click', () => {
      state.stock.push(makeStockItem());
      saveState();
      renderStockView();
    });
    box.appendChild(addBtn);

    main.appendChild(box);
  }

  /* ---------------- BILAN JOURNALIER VIEW ---------------- */

  let addDailyLogFormOpen = false;
  let dailyLogDraft = {date:'', author:'', summary:'', remarks:'', photos:[]};

  function renderDailyLogView(){
    const main = document.getElementById('rfMain');
    main.innerHTML = '';
    if(!state.dailyLogs) state.dailyLogs = [];

    const statsWrap = document.createElement('div');
    statsWrap.style.padding = '0 24px 16px';
    statsWrap.innerHTML = `
      <div class="rf-stats-row">
        <div class="rf-stat-card"><div class="rf-stat-num">${state.dailyLogs.length}</div><div class="rf-stat-label">Bilans enregistrés</div></div>
      </div>
    `;
    main.appendChild(statsWrap);

    const list = document.createElement('div');
    list.className = 'rf-list';

    const sorted = [...state.dailyLogs].sort((a,b) => (b.date||'').localeCompare(a.date||''));
    if(sorted.length === 0){
      const empty = document.createElement('div');
      empty.className = 'rf-empty';
      empty.textContent = "Aucun bilan journalier pour l'instant.";
      list.appendChild(empty);
    }
    sorted.forEach(log => {
      const item = document.createElement('div');
      item.className = 'rf-report-item';
      const top = document.createElement('div');
      top.className = 'rf-report-top';
      const dateSpan = document.createElement('span');
      dateSpan.className = 'rf-report-month';
      dateSpan.textContent = formatDateFR(log.date);
      top.appendChild(dateSpan);
      if(log.author){
        const authorSpan = document.createElement('span');
        authorSpan.className = 'rf-emp-role';
        authorSpan.textContent = log.author;
        top.appendChild(authorSpan);
      }
      item.appendChild(top);
      if(log.summary){
        const t1 = document.createElement('div');
        t1.className = 'rf-report-text';
        t1.innerHTML = `<b>Ce qui a été fait :</b> ${log.summary}`;
        item.appendChild(t1);
      }
      if(log.remarks){
        const t2 = document.createElement('div');
        t2.className = 'rf-report-text';
        t2.innerHTML = `<b>Remarques :</b> ${log.remarks}`;
        item.appendChild(t2);
      }
      if(!Array.isArray(log.photos)) log.photos = [];
      const panel = document.createElement('div');
      panel.className = 'rf-photo-panel';
      panel.appendChild(renderPhotoUploader(log.photos, () => { saveState(); renderDailyLogView(); }));
      item.appendChild(panel);
      const delRow = document.createElement('div');
      delRow.className = 'rf-report-del';
      const delBtn = document.createElement('button');
      delBtn.className = 'rf-icon-btn rf-danger';
      delBtn.textContent = 'Supprimer ce bilan';
      delBtn.addEventListener('click', () => {
        state.dailyLogs = state.dailyLogs.filter(x => x !== log);
        saveState(); renderDailyLogView();
      });
      delRow.appendChild(delBtn);
      item.appendChild(delRow);
      list.appendChild(item);
    });

    main.appendChild(list);

    const wrap = document.createElement('div');
    wrap.style.padding = '0 24px 24px';
    const box = document.createElement('div');
    box.className = 'rf-add-card';

    const toggle = document.createElement('button');
    toggle.className = 'rf-add-toggle';
    toggle.textContent = '+ Ajouter le bilan du jour';
    box.appendChild(toggle);

    const form = document.createElement('div');
    form.className = 'rf-add-form' + (addDailyLogFormOpen ? ' rf-show' : '');
    form.innerHTML = `
      <span class="rf-field-label">Date</span>
      <input type="date" id="rfLogDate" value="${dailyLogDraft.date || todayISO()}">
      <span class="rf-field-label">Rédigé par (optionnel)</span>
      <input type="text" id="rfLogAuthor" placeholder="Nom" value="${dailyLogDraft.author || ''}">
      <span class="rf-field-label">Ce qui a été fait aujourd'hui</span>
      <textarea id="rfLogSummary" rows="3" placeholder="Résumé de la journée...">${dailyLogDraft.summary || ''}</textarea>
      <span class="rf-field-label">Remarques</span>
      <textarea id="rfLogRemarks" rows="2" placeholder="Incidents, points à suivre, retards...">${dailyLogDraft.remarks || ''}</textarea>
      <span class="rf-field-label">Photos</span>
      <div id="rfLogPhotos"></div>
      <button class="rf-add-submit" id="rfLogSubmit">Enregistrer le bilan</button>
    `;
    box.appendChild(form);
    form.querySelector('#rfLogPhotos').appendChild(renderPhotoUploader(dailyLogDraft.photos, () => renderDailyLogView()));

    toggle.addEventListener('click', () => { addDailyLogFormOpen = !addDailyLogFormOpen; form.classList.toggle('rf-show', addDailyLogFormOpen); });
    form.querySelector('#rfLogDate').addEventListener('input', e => { dailyLogDraft.date = e.target.value; });
    form.querySelector('#rfLogAuthor').addEventListener('input', e => { dailyLogDraft.author = e.target.value; });
    form.querySelector('#rfLogSummary').addEventListener('input', e => { dailyLogDraft.summary = e.target.value; });
    form.querySelector('#rfLogRemarks').addEventListener('input', e => { dailyLogDraft.remarks = e.target.value; });

    form.querySelector('#rfLogSubmit').addEventListener('click', () => {
      const date = form.querySelector('#rfLogDate').value || todayISO();
      state.dailyLogs.push({
        id: 'd' + Date.now(),
        date: date,
        author: (dailyLogDraft.author || '').trim(),
        summary: (dailyLogDraft.summary || '').trim(),
        remarks: (dailyLogDraft.remarks || '').trim(),
        photos: dailyLogDraft.photos || []
      });
      dailyLogDraft = {date:'', author:'', summary:'', remarks:'', photos:[]};
      addDailyLogFormOpen = false;
      saveState();
      renderDailyLogView();
    });

    wrap.appendChild(box);
    main.appendChild(wrap);
  }

  function renderAll(){
    if(currentRole !== 'direction' && (state.activeProjectId === 'overview' || state.activeProjectId === 'team')){
      state.activeProjectId = state.projects[0] ? state.projects[0].id : 'overview';
    }
    updateRoleBtn();
    renderHeaderStatic();
    renderTabs();
    renderHeaderDynamic();
    if(state.activeProjectId === 'overview') renderOverview();
    else if(state.activeProjectId === 'team') renderTeamView();
    else if(state.activeProjectId === 'stock') renderStockView();
    else if(state.activeProjectId === 'dailylog') renderDailyLogView();
    else renderProjectView();
  }

  document.getElementById('rfResetBtn').addEventListener('click', async () => {
    if(confirm('Réinitialiser TOUTES les données (marchés, véhicules, tâches, coûts, équipe) ? Cette action est irréversible.')){
      state = freshState();
      openCards = new Set();
      openEmployeeCards = new Set();
      await saveState();
      renderAll();
    }
  });

  async function init(){
    state = await loadState();
    const specialIds = ['overview','team','stock','dailylog'];
    if(!specialIds.includes(state.activeProjectId) && !state.projects.find(p => p.id === state.activeProjectId)){
      state.activeProjectId = 'overview';
    }
    renderAll();
  }

  init();
})();
</script>
